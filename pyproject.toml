[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "randputf"
version = "1.0.0"
description = "randputF - generateur externe de seeds pour le randomizer total Factorio 2.0"
requires-python = ">=3.11"
dependencies = [
    "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
randputf = "tool.__main__:main"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["."]
include = ["tool*", "mod", "data", "config"]
namespaces = true

# Assets embarqués dans le wheel : le tool doit pouvoir générer depuis un
# install classique (pas seulement un checkout). ``mod``/``data``/``config``
# deviennent des namespace packages (dépourvus d'__init__.py) dont les fichiers
# voyagent ici ; ``tool.common.assets.asset_path`` les résout, avec repli dépôt.
[tool.setuptools.package-data]
mod = ["*.lua", "*.json", "graphics/*.png", "locale/en/*.cfg", "locale/fr/*.cfg"]
data = ["*.json"]
config = ["*.yaml"]
