name: Release

# La release EST la promotion dev -> master : le workflow se déclenche quand
# master reçoit le travail de dev. Il lit la version dans mod/info.json
# (source de vérité unique), construit le mod et publie la release, en
# créant le tag v<version> sur le commit master.
#
# workflow_dispatch permet de relancer après un échec sans repousser master.
on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: write

# Deux promotions simultanées ne doivent pas publier deux fois la même chose.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Vérifier la version et la note
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(python -c "import json; print(json.load(open('mod/info.json'))['version'])")
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "TAG=v${VERSION}"
          echo "TAG=v${VERSION}" >> "$GITHUB_ENV"
          NOTE_FILE="notes/v${VERSION}.md"
          if [ ! -f "$NOTE_FILE" ]; then
            echo "ERREUR: $NOTE_FILE introuvable - impossible de publier sans note"
            exit 1
          fi
          if git ls-remote --exit-code --tags origin "refs/tags/v${VERSION}" >/dev/null 2>&1; then
            echo "ERREUR: le tag v${VERSION} existe déjà - version déjà publiée"
            exit 1
          fi
          echo "À publier : v${VERSION} (commit $(git rev-parse --short HEAD))"
      - name: Installer
        run: |
          python -m pip install --upgrade pip
          # Extras de DEV, comme .github/workflows/ci.yml : le job lance
          # pytest juste après. Avec un simple `pip install .`, pytest ne serait
          # pas installé et le job échouerait sur « pytest: command not found »
          # -- pas sur un test cassé, ce qui est pire : la panne ressemblerait
          # à de la documentation, pas à un outillage manquant.
          pip install ".[dev]"
        # ci.yml tourne en parallèle sur le même push : sans ce test ici, un commit

      # qui casse la suite publierait quand même une release.
      - name: Tester
        run: pytest -q
      - name: Déterminisme seed 5
        run: |
          cd /tmp
          randputf witness --seed 5
      - name: Generer le mod
        run: |
          mkdir -p /tmp/modrel
          randputf generate --seed 5 --out /tmp/modrel
          # Les vues HTML de debug sont exclues : elles sont déjà écartées du
          # témoin de déterminisme (WITNESS_EXCLUDED) ; elles se régénèrent en local
          # avec `randputf generate`. Factorio n'en a pas besoin.
          cd /tmp/modrel && zip -qr "/tmp/randputF_${VERSION}.zip" "randputF_${VERSION}" \
            -x "*/seed.graph.html" -x "*/seed.difficulty.html" -x "*/seed.complexity.html"
      - name: Créer le tag
        run: |
          # Tag pose explicitement sur le commit promu. Sans cela, une release
          # publiée depuis un brouillon fait creer le tag par GitHub au
          # targetCommitish du brouillon -- donc sur le bon commit par
          # coincidence, pas par construction. Le push du tag ne redémarre rien :
          # le workflow n'écoute pas les tags.
          git tag "$TAG" "$GITHUB_SHA"
          git push origin "$TAG"
          echo "tag $TAG -> $(git rev-parse --short "$TAG")"
      - name: Publier la release GitHub
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ZIP="/tmp/randputF_${VERSION}.zip"
          NOTE_FILE="notes/v${VERSION}.md"
          TITLE=$(head -1 "$NOTE_FILE" | sed 's/^# //')
          if gh release view "$TAG" --json tagName -q .tagName >/dev/null 2>&1; then
            gh release upload "$TAG" "$ZIP" --clobber
            # --draft=false : sans lui, une release créée en brouillon reste
            # brouillon (gh release edit ne publie pas de lui-même).
            gh release edit "$TAG" --title "$TITLE" --notes-file "$NOTE_FILE" --draft=false
          else
            gh release create "$TAG" "$ZIP" \
              --title "$TITLE" \
              --notes-file "$NOTE_FILE"
          fi