name: Release

# La release EST la promotion dev -> master : le workflow se declenche quand
# master recoit le travail de dev. Il lit la version dans mod/info.json
# (source de verite unique), construit le mod et publie la release, en
# creant le tag v<version> sur le commit master.
#
# workflow_dispatch permet de relancer apres un echec sans repousser master.
on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: write

# Deux promotions simultanees ne doivent pas publier deux fois la meme chose.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verifier la version et la note
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(python -c "import json; print(json.load(open('mod/info.json'))['version'])")
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "TAG=v${VERSION}"
          echo "TAG=v${VERSION}" >> "$GITHUB_ENV"
          NOTE_FILE="notes/v${VERSION}.md"
          if [ ! -f "$NOTE_FILE" ]; then
            echo "ERREUR: $NOTE_FILE introuvable - impossible de publier sans note"
            exit 1
          fi
          if git ls-remote --exit-code --tags origin "refs/tags/v${VERSION}" >/dev/null 2>&1; then
            echo "ERREUR: le tag v${VERSION} existe deja - version deja publiee"
            exit 1
          fi
          echo "A publier : v${VERSION} (commit $(git rev-parse --short HEAD))"
      - name: Installer
        run: |
          python -m pip install --upgrade pip
          pip install .
      # ci.yml tourne en parallele sur le meme push : sans ce test ici, un commit
      # qui casse la suite publierait quand meme une release.
      - name: Tester
        run: pytest -q
      - name: Determinisme seed 5
        run: |
          cd /tmp
          randputf witness --seed 5
      - name: Generer le mod
        run: |
          mkdir -p /tmp/modrel
          randputf generate --seed 5 --out /tmp/modrel
          # seed.graph.html est exclu : c'est une vue de debug de 5 Mo, deja
          # ecartee du temoin de determinisme (WITNESS_EXCLUDED). Livre, il
          # ferait passer le zip de 52 Ko a 5,2 Mo pour rien -- Factorio n'en a
          # pas besoin. Il se regenere en local avec `randputf generate`.
          cd /tmp/modrel && zip -qr "/tmp/randputF_${VERSION}.zip" "randputF_${VERSION}" \
            -x "*/seed.graph.html"
      - name: Creer le tag
        run: |
          # Tag pose explicitement sur le commit promu. Sans cela, une release
          # publiee depuis un brouillon fait creer le tag par GitHub au
          # targetCommitish du brouillon -- donc sur le bon commit par
          # coincidence, pas par construction. Le push du tag ne redemarre rien :
          # le workflow n'ecoute pas les tags.
          git tag "$TAG" "$GITHUB_SHA"
          git push origin "$TAG"
          echo "tag $TAG -> $(git rev-parse --short "$TAG")"
      - name: Publier la release Github
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ZIP="/tmp/randputF_${VERSION}.zip"
          NOTE_FILE="notes/v${VERSION}.md"
          TITLE=$(head -1 "$NOTE_FILE" | sed 's/^# //')
          if gh release view "$TAG" --json tagName -q .tagName >/dev/null 2>&1; then
            gh release upload "$TAG" "$ZIP" --clobber
            # --draft=false : sans lui, une release creee en brouillon reste
            # brouillon (gh release edit ne publie pas de lui-meme).
            gh release edit "$TAG" --title "$TITLE" --notes-file "$NOTE_FILE" --draft=false
          else
            gh release create "$TAG" "$ZIP" \
              --title "$TITLE" \
              --notes-file "$NOTE_FILE"
          fi