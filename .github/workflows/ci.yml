name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Installer
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev]
      - name: Tester
        run: pytest -q
      - name: Vérifier les ancres Markdown
        run: python tools/check_anchors.py

  wheel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Installer le wheel
        run: |
          python -m pip install --upgrade pip
          pip install .
      - name: Témoin de déterminisme (seed 5, depuis /tmp hors checkout)
        run: |
          cd /tmp
          randputf witness --seed 5 --expect 647ab8833f639846ba36f9c52f38fb94