name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Installer
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev]
      - name: Tester
        run: pytest -q

  wheel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Installer le wheel
        run: |
          python -m pip install --upgrade pip
          pip install .
      - name: Temoin de determinisme (seed 5, depuis /tmp hors checkout)
        run: |
          cd /tmp
          randputf witness --seed 5 --expect 0da5ddb27550b9942b7434a5459ceb4e